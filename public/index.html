<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Assignment Tracker</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <div class="container">
    <header>
      <h1>📚 Assignment Tracker</h1>
      <p class="subtitle">Built with a custom HTTP server — no Express, no frameworks</p>
    </header>

    <form id="add-form">
      <input type="text" id="title" placeholder="Assignment title" required />
      <input type="text" id="course" placeholder="Course name" required />
      <input type="date" id="dueDate" required />
      <button type="submit">Add</button>
    </form>

    <div class="filters">
      <button class="filter active" data-filter="all">All</button>
      <button class="filter" data-filter="pending">Pending</button>
      <button class="filter" data-filter="done">Done</button>
    </div>

    <ul id="assignments"></ul>
  </div>

  <script src="/app.js"></script>
</body>
</html>
